name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Legacy reference check
        run: ./scripts/check-legacy-refs.sh

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON is not set; building without Firebase push wake-ups"
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Write signing keystore
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_STORE_BASE64" ]; then
            echo "SIGNING_KEY_STORE_BASE64 secret is missing" >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEY_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEY_STORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build signed release APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Prepare artifacts
        id: artifacts
        run: |
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "Signed release APK not found; check the signing secrets" >&2
            ls -la app/build/outputs/apk/release >&2 || true
            exit 1
          fi
          name="homing-${GITHUB_REF_NAME}.apk"
          mkdir -p dist
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "apk=dist/$name" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/$name.sha256" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "${{ steps.artifacts.outputs.apk }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.artifacts.outputs.apk }}
            ${{ steps.artifacts.outputs.checksum }}
          generate_release_notes: true
          fail_on_unmatched_files: true
