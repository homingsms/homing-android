naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

complexity:
  LongParameterList:
    ignoreDefaultParameters: true
  LongMethod:
    ignoreAnnotated: ['Composable', 'Preview', 'HomingPreviews']

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview', 'HomingPreviews']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview', 'HomingPreviews']
